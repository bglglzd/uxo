name: Dependency audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "DEPENDENCIES.md"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "DEPENDENCIES.md"
      - ".github/workflows/dependency-audit.yml"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Audit frontend dependencies
        run: bun audit
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit native dependency lockfile
        # Informational upstream warnings are tracked in DEPENDENCIES.md.
        # Known vulnerabilities fail this job; no advisory IDs are ignored.
        run: cargo audit --file src-tauri/Cargo.lock
