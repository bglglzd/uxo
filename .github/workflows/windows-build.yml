name: Windows x64 package

on:
  workflow_dispatch:

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    permissions:
      # The reusable build can attach assets when a release ID is supplied.
      # This manual caller supplies none and retains workflow artifacts only.
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      upload-artifacts: true
      no-cache: false
