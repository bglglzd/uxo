name: Rust tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Windows x64 CPU test suite
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: windows-x64-cpu-tests

      - name: Run Rust tests with the verified CPU runtime
        shell: pwsh
        env:
          RUST_BACKTRACE: "1"
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsRoot) { throw 'Visual Studio x64 C++ build tools were not found.' }

          $vsCmake = Join-Path $vsRoot 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'
          $vsNinja = Join-Path $vsRoot 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe'
          if (-not (Test-Path -LiteralPath $vsCmake) -or -not (Test-Path -LiteralPath $vsNinja)) {
            throw 'Visual Studio CMake or Ninja was not found.'
          }

          $redistVersion = (Get-Content -LiteralPath (Join-Path $vsRoot 'VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt') -Raw).Trim()
          $redistRoot = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\x64"
          $crtRedist = Get-ChildItem -LiteralPath $redistRoot -Directory -Filter 'Microsoft.VC*.CRT' |
            Sort-Object Name | Select-Object -Last 1
          if (-not $crtRedist) { throw "The x64 VC++ runtime is missing under $redistRoot" }

          $ortVersion = '1.24.2'
          $ortSha256 = '8E3E9C826375352E29CB2614FE44F3D7A4B0FF7B8028AD7A456AF9D949A7E8B0'
          $ortArchive = Join-Path $env:RUNNER_TEMP "onnxruntime-win-x64-$ortVersion.zip"
          $ortRoot = Join-Path $env:RUNNER_TEMP "onnxruntime-$ortVersion"
          Invoke-WebRequest `
            -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$ortVersion/onnxruntime-win-x64-$ortVersion.zip" `
            -OutFile $ortArchive
          $actualHash = (Get-FileHash -LiteralPath $ortArchive -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualHash -ne $ortSha256) {
            throw "ONNX Runtime SHA-256 mismatch: expected $ortSha256, got $actualHash"
          }
          Expand-Archive -LiteralPath $ortArchive -DestinationPath $ortRoot -Force
          $ortLib = Join-Path $ortRoot "onnxruntime-win-x64-$ortVersion\lib"
          if (-not (Test-Path -LiteralPath (Join-Path $ortLib 'onnxruntime.dll'))) {
            throw 'The verified ONNX Runtime package is incomplete.'
          }

          $env:CMAKE = $vsCmake
          $env:CMAKE_GENERATOR = 'Ninja'
          $env:CMAKE_MAKE_PROGRAM = $vsNinja
          $env:CMAKE_ARGS = '-DGGML_CCACHE=OFF'
          $env:ORT_LIB_LOCATION = $ortLib
          $env:ORT_PREFER_DYNAMIC_LINK = '1'
          $env:UXO_VC_REDIST_DIRS = $crtRedist.FullName
          $env:PATH = "$ortLib;$(Split-Path -Parent $vsNinja);$env:PATH"

          $vcvars = Join-Path $vsRoot 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars)) {
            throw "vcvars64.bat was not found: $vcvars"
          }
          & cmd.exe /d /s /c "`"$vcvars`" >nul && cargo test --locked --manifest-path src-tauri/Cargo.toml"
          if ($LASTEXITCODE -ne 0) { throw 'The Rust test suite failed.' }
