name: Windows x64 build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build; defaults to the calling workflow commit.
        required: false
        type: string
        default: ""
      release-id:
        description: Optional draft GitHub release ID to receive the installers.
        required: false
        type: string
        default: ""
      upload-artifacts:
        description: Retain installers as workflow artifacts.
        required: false
        type: boolean
        default: true
      no-cache:
        description: Build without restoring the Rust cache.
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Unsigned Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\FileSystem" `
            -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release version metadata
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tauriVersion = (Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path 'src-tauri/Cargo.toml' -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $tauriVersion -or $tauriVersion -ne $packageVersion -or $tauriVersion -ne $cargoVersion) {
            throw "Version mismatch: tauri=$tauriVersion package=$packageVersion cargo=$cargoVersion"
          }
          "version=$tauriVersion" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Rust cache
        if: ${{ !inputs.no-cache }}
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: windows-x64-cpu

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Prepare verified native dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsRoot) { throw 'Visual Studio x64 C++ build tools were not found.' }

          $vsCmake = Join-Path $vsRoot 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'
          $vsNinja = Join-Path $vsRoot 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe'
          if (-not (Test-Path -LiteralPath $vsCmake) -or -not (Test-Path -LiteralPath $vsNinja)) {
            throw 'Visual Studio CMake or Ninja was not found.'
          }

          $redistVersionFile = Join-Path $vsRoot 'VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt'
          $redistVersion = (Get-Content -LiteralPath $redistVersionFile -Raw).Trim()
          $redistRoot = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\x64"
          $crtRedist = Get-ChildItem -LiteralPath $redistRoot -Directory -Filter 'Microsoft.VC*.CRT' |
            Sort-Object Name | Select-Object -Last 1
          if (-not $crtRedist -or -not (Test-Path -LiteralPath (Join-Path $crtRedist.FullName 'msvcp140.dll'))) {
            throw "The x64 VC++ runtime is missing under $redistRoot"
          }

          $ortVersion = '1.24.2'
          $ortSha256 = '8E3E9C826375352E29CB2614FE44F3D7A4B0FF7B8028AD7A456AF9D949A7E8B0'
          $ortArchive = Join-Path $env:RUNNER_TEMP "onnxruntime-win-x64-$ortVersion.zip"
          $ortRoot = Join-Path $env:RUNNER_TEMP "onnxruntime-$ortVersion"
          Invoke-WebRequest `
            -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$ortVersion/onnxruntime-win-x64-$ortVersion.zip" `
            -OutFile $ortArchive
          $actualHash = (Get-FileHash -LiteralPath $ortArchive -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualHash -ne $ortSha256) {
            throw "ONNX Runtime SHA-256 mismatch: expected $ortSha256, got $actualHash"
          }
          Expand-Archive -LiteralPath $ortArchive -DestinationPath $ortRoot -Force
          $ortLib = Join-Path $ortRoot "onnxruntime-win-x64-$ortVersion\lib"
          $ortDll = Join-Path $ortLib 'onnxruntime.dll'
          if (-not (Test-Path -LiteralPath $ortDll) -or -not (Test-Path -LiteralPath (Join-Path $ortLib 'onnxruntime.lib'))) {
            throw 'The verified ONNX Runtime package is incomplete.'
          }

          $dumpbin = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found.' }
          $ortImports = (& $dumpbin /nologo /dependents $ortDll | Out-String)
          foreach ($forbidden in @('directml.dll', 'd3d12.dll')) {
            if ($ortImports -match "(?im)^\s*$([regex]::Escape($forbidden))\s*$") {
              throw "The selected CPU-only ONNX Runtime package imports $forbidden"
            }
          }

          "CMAKE=$vsCmake" | Add-Content -LiteralPath $env:GITHUB_ENV
          'CMAKE_GENERATOR=Ninja' | Add-Content -LiteralPath $env:GITHUB_ENV
          "CMAKE_MAKE_PROGRAM=$vsNinja" | Add-Content -LiteralPath $env:GITHUB_ENV
          'CMAKE_ARGS=-DGGML_CCACHE=OFF' | Add-Content -LiteralPath $env:GITHUB_ENV
          "ORT_LIB_LOCATION=$ortLib" | Add-Content -LiteralPath $env:GITHUB_ENV
          'ORT_PREFER_DYNAMIC_LINK=1' | Add-Content -LiteralPath $env:GITHUB_ENV
          "UXO_VC_REDIST_DIRS=$($crtRedist.FullName)" | Add-Content -LiteralPath $env:GITHUB_ENV
          $ortLib | Add-Content -LiteralPath $env:GITHUB_PATH
          (Split-Path -Parent $vsNinja) | Add-Content -LiteralPath $env:GITHUB_PATH

      - name: Build unsigned installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $vcvars = Join-Path $vsRoot 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars)) {
            throw "vcvars64.bat was not found: $vcvars"
          }

          # Keep compiler, SDK, and library discovery in the same process tree as
          # Cargo; a normal GitHub-hosted PowerShell session does not guarantee
          # that cl.exe, INCLUDE, and LIB have been initialized.
          & cmd.exe /d /s /c "`"$vcvars`" >nul && bun run tauri build"
          if ($LASTEXITCODE -ne 0) { throw 'The Windows installer build failed.' }

      - name: Audit packaged CPU-only runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = (Resolve-Path 'src-tauri/target/release/bundle').Path
          $releaseExe = (Resolve-Path 'src-tauri/target/release/uxo.exe').Path
          $stagedDlls = Get-ChildItem 'src-tauri/transcribe-libs' -File -Filter '*.dll'
          foreach ($required in @('onnxruntime.dll', 'msvcp140.dll', 'vcruntime140.dll')) {
            if (-not ($stagedDlls | Where-Object Name -IEQ $required)) {
              throw "Runtime staging is missing $required"
            }
          }
          foreach ($forbidden in @('directml.dll', 'd3d12.dll', 'vcomp140.dll')) {
            if ($stagedDlls | Where-Object Name -IEQ $forbidden) {
              throw "Runtime staging unexpectedly contains $forbidden"
            }
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $imports = (& $dumpbin /nologo /dependents $releaseExe | Out-String)
          if ($imports -notmatch '(?im)^\s*onnxruntime\.dll\s*$') {
            throw 'uxo.exe must import the staged CPU-only onnxruntime.dll.'
          }
          foreach ($forbidden in @('directml.dll', 'd3d12.dll', 'vcomp140.dll')) {
            if ($imports -match "(?im)^\s*$([regex]::Escape($forbidden))\s*$") {
              throw "uxo.exe unexpectedly imports $forbidden"
            }
          }

          function Remove-AuditDirectory([string]$Path) {
            $tempRoot = [IO.Path]::GetFullPath([IO.Path]::GetTempPath())
            $resolved = [IO.Path]::GetFullPath($Path)
            if (-not $resolved.StartsWith($tempRoot, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Refusing to remove a directory outside the runner temp root: $resolved"
            }
            Remove-Item -LiteralPath $resolved -Recurse -Force
          }

          function Assert-InstalledPackage([string]$Root, [string]$Label) {
            $installedExe = Get-ChildItem -LiteralPath $Root -Recurse -File -Filter 'uxo.exe' | Select-Object -First 1
            if (-not $installedExe) { throw "$Label package is missing uxo.exe" }
            foreach ($dll in $stagedDlls) {
              if (-not (Get-ChildItem -LiteralPath $Root -Recurse -File -Filter $dll.Name | Select-Object -First 1)) {
                throw "$Label package is missing $($dll.Name)"
              }
            }
            $deviceOutput = (& $installedExe.FullName --list-devices | Out-String)
            if ($LASTEXITCODE -ne 0 -or $deviceOutput -notmatch 'kind=cpu') {
              throw "$Label CPU smoke test failed.`n$deviceOutput"
            }
            if ($deviceOutput -match 'kind=(vulkan|cuda|metal|gpu)') {
              throw "$Label unexpectedly exposed a GPU compute device.`n$deviceOutput"
            }
          }

          $nsisPackages = Get-ChildItem (Join-Path $bundleRoot 'nsis') -File -Filter '*.exe'
          if (-not $nsisPackages) { throw 'No NSIS installer was produced.' }
          foreach ($package in $nsisPackages) {
            $installRoot = Join-Path ([IO.Path]::GetTempPath()) ([Guid]::NewGuid().ToString())
            New-Item -ItemType Directory -Path $installRoot | Out-Null
            try {
              $process = Start-Process -FilePath $package.FullName -ArgumentList @('/S', '/PORTABLE', "/D=$installRoot") -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "NSIS portable install failed with exit code $($process.ExitCode)" }
              Assert-InstalledPackage $installRoot 'NSIS'
            } finally {
              if (Test-Path -LiteralPath $installRoot) { Remove-AuditDirectory $installRoot }
            }
          }

          $msiPackages = Get-ChildItem (Join-Path $bundleRoot 'msi') -File -Filter '*.msi'
          if (-not $msiPackages) { throw 'No MSI installer was produced.' }
          foreach ($package in $msiPackages) {
            $installRoot = Join-Path ([IO.Path]::GetTempPath()) ([Guid]::NewGuid().ToString())
            New-Item -ItemType Directory -Path $installRoot | Out-Null
            try {
              $logFile = Join-Path $installRoot 'msi-admin-install.log'
              $arguments = "/a `"$($package.FullName)`" /qn /L*v `"$logFile`" TARGETDIR=`"$installRoot`""
              $process = Start-Process -FilePath 'msiexec.exe' -ArgumentList $arguments -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                if (Test-Path -LiteralPath $logFile) { Get-Content -LiteralPath $logFile | Out-Host }
                throw "MSI administrative install failed with exit code $($process.ExitCode)"
              }
              Assert-InstalledPackage $installRoot 'MSI'
            } finally {
              if (Test-Path -LiteralPath $installRoot) { Remove-AuditDirectory $installRoot }
            }
          }

      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $bundleRoot = (Resolve-Path 'src-tauri/target/release/bundle').Path
          $packages = @(
            Get-ChildItem (Join-Path $bundleRoot 'nsis') -File -Filter '*.exe'
            Get-ChildItem (Join-Path $bundleRoot 'msi') -File -Filter '*.msi'
          ) | Sort-Object Name
          $lines = foreach ($package in $packages) {
            $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($package.Name)"
          }
          $manifest = Join-Path $bundleRoot 'SHA256SUMS.txt'
          [IO.File]::WriteAllLines($manifest, $lines, [Text.Encoding]::ASCII)
          Get-Content -LiteralPath $manifest

      - name: Upload workflow artifacts
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: uxo-windows-x64-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Attach installers and checksum manifest to the verified draft
        if: inputs.release-id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_TARGET: ${{ inputs.ref != '' && inputs.ref || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v${{ steps.version.outputs.version }}"
          $repository = '${{ github.repository }}'
          $expectedId = '${{ inputs.release-id }}'
          $release = gh api "repos/$repository/releases/$expectedId" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not read release ID $expectedId." }
          if ([string]$release.id -ne $expectedId -or $release.tag_name -ne $tag -or
              -not $release.draft -or -not $release.prerelease) {
            throw "Release ID $expectedId is not the expected draft prerelease for $tag."
          }
          if ($release.target_commitish -ne $env:EXPECTED_TARGET) {
            throw "Release ID $expectedId targets $($release.target_commitish), not $env:EXPECTED_TARGET."
          }
          # /releases/tags/{tag} only resolves published releases, never
          # drafts, so list every release and require exactly one for $tag.
          $env:RELEASE_TAG = $tag
          $tagReleaseIds = @(gh api --paginate "repos/$repository/releases?per_page=100" --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id')
          if ($LASTEXITCODE -ne 0) { throw "Could not list releases for $tag." }
          if ($tagReleaseIds.Count -ne 1 -or [string]$tagReleaseIds[0] -ne $expectedId) {
            throw "The $tag release no longer resolves to expected release ID $expectedId (found: $($tagReleaseIds -join ', '))."
          }
          $tagProbe = gh api "repos/$repository/git/ref/tags/$tag" --silent 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw "The tag $tag already exists; refusing to attach newly built assets."
          }
          if (($tagProbe | Out-String) -notmatch '(?i)(HTTP 404|not found|reference does not exist)') {
            throw "Could not safely verify that tag $tag is absent: $tagProbe"
          }

          $assets = @(
            Get-ChildItem 'src-tauri/target/release/bundle/nsis' -File -Filter '*.exe'
            Get-ChildItem 'src-tauri/target/release/bundle/msi' -File -Filter '*.msi'
            Get-Item 'src-tauri/target/release/bundle/SHA256SUMS.txt'
          )
          if ($assets.Count -ne 3) {
            throw "Expected one NSIS installer, one MSI, and one checksum manifest; found $($assets.Count)."
          }
          gh release upload $tag @($assets.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Uploading draft release assets failed.' }
